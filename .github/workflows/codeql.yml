name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# broflora is a stateful simulation core doing a lot of hand-indexed work over
# module / node / prototype arrays (Voronoi spawn, pipe-model topology walks,
# spatial-hash neighbour queries). Index and offset arithmetic driving those
# buffer accesses is where an out-of-bounds slip hides, so that is where the
# analysis pays off.
jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          path: broflora

      - uses: actions/checkout@v7
        with:
          repository: wlejon/bromath
          path: bromath

      - uses: actions/checkout@v7
        with:
          repository: wlejon/bromesh
          path: bromesh
          submodules: recursive

      # Debug / -O0 keeps the extracted IR close to the source so dataflow paths
      # in the results point at code a human can act on.
      - name: Configure
        run: cmake -S broflora -B build -DCMAKE_BUILD_TYPE=Debug

      # The sibling bromesh library and the seven submodules it vendors are
      # compiled here, ahead of `init`. For a compiled language CodeQL only
      # extracts what it observes the compiler build while tracing, so anything
      # already built when `init` runs is never analysed. That is the exclusion
      # mechanism — paths-ignore does not filter compiled sources — and it keeps
      # bromesh and its vendored code out of broflora's Security tab, where they
      # do not belong (each is upstream with its own maintainers). bromath needs
      # no entry: header-only, no TUs of its own, so its headers are analysed
      # where broflora includes them.
      - name: Pre-build the siblings (outside the traced build)
        run: |
          cmake --build build --parallel 4 --target \
            bromesh meshoptimizer par_shapes tinygltf vhacd xatlas \
            manifold_lib openfbx osqpstatic

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          # Relative to the workspace root; this repo is checked out into
          # broflora/ (not the root) so the siblings can sit beside it.
          # paths-ignore is the second line of defence, catching any finding that
          # originates in a sibling *header* pulled into a broflora TU.
          config-file: broflora/.github/codeql/codeql-config.yml

      # Only broflora's own library TUs are left to compile, so only they are
      # traced. The test binary is not built here — CodeQL does not run it, and
      # the library is the surface worth analysing.
      - name: Build broflora (traced)
        run: cmake --build build --parallel 4 --target broflora

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
