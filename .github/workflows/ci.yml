name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job builds a plain clone, checked out under broflora/ with the build
# tree beside it. Its dependencies — bromath, bromesh (with bromesh's own
# third-party libraries), and bronze, the JavaScript runtime broflora_api binds
# and the compiler that builds src/api/js/flora.js, with brass, its code
# generator — come from the heads of their main branches (cmake/bro_deps.cmake),
# fetched at configure. There are no submodules and no sibling checkouts.
#
# bronze and brass compile inside this build tree with the job's own compiler
# and CRT — the api is bound across bronze's C++ embed boundary, so a prebuilt
# bronze would be an unverifiable ABI hazard. That is what makes
# broflora_api_test the check that the library works the way bro uses it. brass
# has native x86_64 and AArch64 code generators, so the JS is compiled and the
# test runs on every row, macos-arm64 included.
#
# Release, not Debug: broflora links bromesh, whose meshoptimizer Debug
# assertions surface as a modal abort() on Windows. Default CMake generator, not
# Ninja: bromesh's osqp dependency fetches the QDLDL solver, whose ancient
# cmake_minimum_required trips "required internal CMake variable not set" under
# Ninja. --parallel bounds the job count regardless.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-24.04, cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-2022 }
          - { name: macos-arm64,  os: macos-15 }
    steps:
      - uses: actions/checkout@v7
        with:
          path: broflora

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S broflora -B build -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Debug + --coverage on Linux. --filter scopes the numbers to broflora's own
  # code (include/broflora/ + src/); the dependencies are excluded.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: broflora

      - name: Install gcovr
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcovr

      - name: Configure (instrumented)
        run: |
          cmake -S broflora -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'broflora/include/broflora/' --filter 'broflora/src/' \
            --exclude-unreachable-branches \
            --gcov-ignore-errors=no_working_dir_found \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `include/broflora/` + `src/`'
            echo
            echo 'The bromath/bromesh dependencies and their third-party code are filtered out.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
